name: Verify PNG Adventure
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/core.js
          node --check src/level.js
          node --check src/art.js
          node --check src/game.js
          node --check coast/player/character.js
          node --check coast/player/animator.js
          node --check coast/player/controller.js
          node --check coast/world/platforms.js
          node --check coast/world/canoes.js
          node --check coast/world/breakaways.js
          node --check coast/world/nets.js
          node --check coast/world/interactions.js
          node --check coast/input/touch.js
          node --check coast/player/workshop.js
          node --check coast/sprites.js
          node --check coast/environment/parallax.js
          node --check coast/environment/water.js
          node --check coast/environment/village.js
          node --check coast/environment/vegetation.js
          node --check coast/environment/wildlife.js
          node --check coast/environment/feedback.js
          node --check coast/environment/render-budget.js
          node --check coast/audio/sound.js
          node --check coast/game.js
      - name: Run game rules tests
        run: npm test
